name: portability

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --no-default-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo build --locked --release --all-features
      - run: cargo build --locked --release --no-default-features
