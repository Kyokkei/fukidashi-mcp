[package]
name = "fukidashi-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local comic-page analysis, cleaning, typesetting and editing over MCP"

[features]
default = ["onnx", "cuda"]
onnx = ["dep:ort"]
cuda = ["onnx", "ort/cuda"]
directml = ["onnx", "ort/directml"]
editor = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "client", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "signal", "net", "time", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = "0.25"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22"] }
rustybuzz = "0.20"
fontdue = "0.9"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
which = "6"

# Editor-only deps (feature-gated so the headless MCP binary stays lean).
eframe = { version = "0.31", optional = true, default-features = false, features = ["glow", "persistence"] }
egui = { version = "0.31", optional = true }
egui_extras = { version = "0.31", optional = true, features = ["image"] }
rfd = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Native egui QA editor. Built separately so the headless MCP binary stays lean:
#   cargo build --features editor --bin fukidashi-editor
[[bin]]
name = "fukidashi-editor"
path = "src/bin/editor_main.rs"
required-features = ["editor"]
